[versions]
checkstyle = "14.3.0"

[libraries]
#
# If a dependency is removed, check whether the LICENSE and/or NOTICE files need to be adopted
# (aka mention of the dependency removed).
#
assertj-core = { module = "org.assertj:assertj-core", version = "3.27.7" }
junit-bom = { module = "org.junit:junit-bom", version = "6.1.3" }
cyclonedx-plugin = { module = "org.cyclonedx:cyclonedx-gradle-plugin", version = "3.5.1" }
cyclonedx-core = { module = "org.cyclonedx:cyclonedx-core-java", version = "13.4.0" }
licensee = { module = "app.cash.licensee:licensee-gradle-plugin", version = "1.14.1" }

# Following are # required by the atr-maven-bundle-java plugin
#
#noinspection UnusedVersionCatalogEntry
checkstyle = { module = "com.puppycrawl.tools:checkstyle", version.ref = "checkstyle" }

[plugins]
idea-ext = { id = "org.jetbrains.gradle.plugin.idea-ext", version = "1.4.1" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version = "2.4.21" }
plugin-publish = { id = "com.gradle.plugin-publish", version = "2.2.1" }
stutter = { id = "org.ajoberstar.stutter", version = "2.0.2" }
