// Deliberately separate from ../../build.gradle.kts: that build creates payloads
// without credentials. Here, -PbuildCentralBundle uses a plugin built from the
// trusted workflow revision to sign files, complete checksums and create the ZIP.
// Portal promotion uploads the retained candidate without loading that plugin.
// Payload compilation/JAR generation remain disabled in both modes. Keep shared
// plugin identity consistent with ../../gradle-plugin/build.gradle.kts.
plugins {
    id 'com.gradle.plugin-publish' version '2.2.1'
}

def bundleMode = providers.gradleProperty('buildCentralBundle').isPresent()
group = 'org.buildish.atr-maven-bundle'
version = providers.environmentVariable('RELEASE_VERSION').get()
def retained = file(providers.environmentVariable('RELEASE_REPOSITORY').get())
def implementationDir = new File(retained, "org/buildish/atr-maven-bundle/gradle-plugin/$version")
def parentDir = new File(retained, "org/buildish/atr-maven-bundle/buildish-atr-maven-bundle/$version")
def pluginId = 'org.buildish.atr-maven-bundle.gradle-plugin'
def markerDir = new File(retained, "${pluginId.replace('.', '/')}/${pluginId}.gradle.plugin/$version")

gradlePlugin {
    website = 'https://buildish.org/components/atr-maven-bundle'
    vcsUrl = 'https://github.com/buildish-tooling/buildish-atr-maven-bundle'
    plugins {
        atrMavenBundle {
            id = pluginId
            displayName = 'Buildish Maven Bundles for Gradle'
            implementationClass = 'org.buildish.atrmavenbundle.gradleplugin.AtrMavenBundlePlugin'
            description = 'Build local Maven Central bundles from Gradle Maven publications for manual upload. ' +
                'Apply in settings.gradle.kts or settings.gradle. Also exports Njord transportable bundles (.ntb). ' +
                'Requires Gradle 9.1+ and Java 17+.'
            tags.addAll('maven-central', 'maven-publish', 'publishing', 'njord', 'settings')
            compatibility {
                features {
                    configurationCache = true
                    isolatedProjects = true
                }
            }
        }
    }
}

// Disable source compilation and all locally generated archive payloads.
tasks.withType(AbstractCompile).configureEach { enabled = false }
tasks.withType(Jar).configureEach { enabled = false }
tasks.withType(Javadoc).configureEach { enabled = false }

publishing {
    repositories { maven { name = 'rehearsal'; url = layout.buildDirectory.dir('repository') } }
    publications {
        if (bundleMode) {
            releaseParent(MavenPublication) { artifactId = 'buildish-atr-maven-bundle' }
        }
    }
    publications.withType(MavenPublication).configureEach {
        if (name == 'pluginMaven') {
            setArtifacts([])
            artifact(new File(implementationDir, "gradle-plugin-${version}.jar"))
            artifact(new File(implementationDir, "gradle-plugin-$version-sources.jar")) { classifier = 'sources' }
            artifact(new File(implementationDir, "gradle-plugin-$version-javadoc.jar")) { classifier = 'javadoc' }
        }
    }
}

tasks.withType(GenerateMavenPom).configureEach {
    doLast {
        def original = name == 'generatePomFileForReleaseParentPublication' ?
                new File(parentDir, "buildish-atr-maven-bundle-${version}.pom") :
                name == 'generatePomFileForPluginMavenPublication' ?
                new File(implementationDir, "gradle-plugin-${version}.pom") :
                new File(markerDir, "${pluginId}.gradle.plugin-${version}.pom")
        destination.bytes = original.bytes
    }
}
tasks.withType(GenerateModuleMetadata).configureEach {
    doLast { outputFile.get().asFile.bytes = new File(implementationDir, "gradle-plugin-${version}.module").bytes }
}

if (bundleMode) {
    // The bundle plugin signs after export. Disable the second signing pass.
    tasks.withType(org.gradle.plugins.signing.Sign).configureEach { enabled = false }
    signing {
        def key = providers.environmentVariable('BUILDISH_GPG_PRIVATE_KEY').get()
        def password = providers.environmentVariable('BUILDISH_GPG_PASSPHRASE').getOrElse('')
        def fingerprint = providers.environmentVariable('BUILDISH_GPG_FINGERPRINT').getOrElse('')
        if (fingerprint) {
            useInMemoryPgpKeys(fingerprint.takeRight(8), key, password)
        } else {
            useInMemoryPgpKeys(key, password)
        }
    }
}
