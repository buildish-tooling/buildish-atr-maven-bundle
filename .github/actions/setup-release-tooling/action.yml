name: Set up Release Tooling
description: Install the exact published package into a runner-temp virtualenv
outputs:
  python:
    description: Installed package interpreter
    value: ${{ steps.install.outputs.python }}
runs:
  using: composite
  steps:
    - id: install
      shell: bash
      run: |
        set -euo pipefail
        python3 -m venv "$RUNNER_TEMP/release-tooling"
        python="$RUNNER_TEMP/release-tooling/bin/python"
        "$python" -m pip --isolated install --only-binary=:all: \
          --index-url https://pypi.org/simple --cache-dir "$RUNNER_TEMP/pip-cache" \
          -r buildish-release-tooling/requirements.txt
        BUILDISH_RELEASE_TOOLING_PYTHON="$python" bash buildish-release-tooling/release-tooling.sh --package-info
        printf 'python=%s\n' "$python" >> "$GITHUB_OUTPUT"
