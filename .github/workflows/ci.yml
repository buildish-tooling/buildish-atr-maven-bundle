name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - release/**

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 17 and 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          # The last version is the build JVM; Stutter selects both consumer JVMs.
          java-version: |
            17
            21
          overwrite-settings: false

      # TODO use Buildish Mammoth Cache in this build once there is a release of it.

      - name: Run checks and packaged consumer compatibility tests
        run: >-
          ./gradlew --no-daemon --stacktrace --console=plain
          -Dorg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_21_X64
          -Dorg.gradle.java.installations.auto-download=false
          check

      - name: Fail when checks leave Git changes behind
        run: |
          modified="$(git status --short)"
          test -z "$modified" || { printf 'Checks left Git changes behind:\n%s\n' "$modified"; exit 1; }

  windows-check:
    name: Windows check
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          overwrite-settings: false

      - name: Run the representative packaged signing and output fixture
        shell: pwsh
        run: >-
          .\gradlew.bat --no-daemon --stacktrace --console=plain
          "-Dorg.gradle.java.installations.auto-download=false"
          :gradle-plugin:functionalTest
          --tests org.buildish.atrmavenbundle.gradleplugin.SigningPreparationTest.softwareSigningSurvivesEarlyRealizationCliOverrideAndConfigurationCacheReuse

      - name: Upload Windows test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-qualification-reports
          path: |
            gradle-plugin/build/reports/tests/functionalTest
            gradle-plugin/build/test-results/functionalTest
          if-no-files-found: warn
          retention-days: 7

  zizmor:
    name: zizmor
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          advanced-security: false

  required_checks:
    name: Required Checks
    if: ${{ always() }}
    needs:
      - check
      - windows-check
      - zizmor
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Assert all required jobs succeeded
        env:
          CHECK_RESULT: ${{ needs.check.result }}
          WINDOWS_CHECK_RESULT: ${{ needs.windows-check.result }}
          ZIZMOR_RESULT: ${{ needs.zizmor.result }}
        run: |
          for result in "$CHECK_RESULT" "$WINDOWS_CHECK_RESULT" "$ZIZMOR_RESULT"; do
            if [ "$result" != success ]; then
              echo "Required job did not succeed: $result"
              exit 1
            fi
          done

  publish-site:
    name: Publish aggregate site
    needs: required_checks
    # Requires BUILDISH_SITE_PUBLISH_TOKEN with Actions write access to the
    # buildish-tooling/buildish repository.
    if: >-
      always() &&
      !cancelled() &&
      needs.required_checks.result == 'success' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-slim
    permissions: {}
    steps:
      - name: Dispatch aggregate site publishing
        env:
          GH_TOKEN: ${{ secrets.BUILDISH_SITE_PUBLISH_TOKEN }}
        run: gh workflow run site-publish.yml --repo buildish-tooling/buildish --ref main
