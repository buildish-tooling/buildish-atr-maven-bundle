name: Release Promote Candidate
'on':
  workflow_dispatch:
    inputs:
      version:
        description: Exact final version X.Y.Z
        required: true
        type: string
      candidate_tag:
        description: Exact approved candidate vX.Y.Z-rcN
        required: true
        type: string
      candidate_manifest_digest:
        description: Independently retained SHA-256 of candidate-manifest.json
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: buildish-release-${{ github.repository }}-${{ inputs.version }}
  cancel-in-progress: false
jobs:
  resolve:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    outputs:
      bundle_digest: ${{ steps.resolve.outputs.bundle_digest }}
      state_digest: ${{ steps.resolve.outputs.state_digest }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.workflow_sha }}
        persist-credentials: false
        fetch-depth: 0
    - uses: $/.github/actions/setup-release-tooling
      id: tooling
    - run: |
        set -euo pipefail
        python3 -B buildish-release-tooling/workflow.py preflight promotion
        mkdir -p "$RUNNER_TEMP/promotion"
        bash buildish-release-tooling/release-tooling.sh verify-github-candidate --candidate-tag "$CANDIDATE_TAG" --candidate-manifest-digest "$CANDIDATE_MANIFEST_DIGEST" --candidate-manifest-output "$RUNNER_TEMP/promotion/candidate-manifest.json"
        python3 -B buildish-release-tooling/workflow.py download "$RUNNER_TEMP/promotion/candidate-manifest.json" "$CANDIDATE_MANIFEST_DIGEST" "$RUNNER_TEMP/promotion/assets" "$RELEASE_VERSION"
        MANIFEST_PATH="$RUNNER_TEMP/promotion/state.json" bash buildish-release-tooling/release-tooling.sh resolve-promotion --candidate-tag "$CANDIDATE_TAG" --candidate-manifest "$RUNNER_TEMP/promotion/candidate-manifest.json" --candidate-manifest-digest "$CANDIDATE_MANIFEST_DIGEST" "$RELEASE_VERSION"
        python3 -B buildish-release-tooling/workflow.py outputs "$RUNNER_TEMP/promotion/state.json"
        python3 -B buildish-release-tooling/workflow.py seal "$RUNNER_TEMP/promotion"
      env:
        BUILDISH_RELEASE_TOOLING_PYTHON: ${{ steps.tooling.outputs.python }}
        RELEASE_VERSION: ${{ inputs.version }}
        CANDIDATE_TAG: ${{ inputs.candidate_tag }}
        CANDIDATE_MANIFEST_DIGEST: ${{ inputs.candidate_manifest_digest }}
        GH_TOKEN: ${{ github.token }}
      id: resolve
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: promotion-input-${{ github.run_id }}
        path: ${{ runner.temp }}/promotion
        if-no-files-found: error
        retention-days: 90
        overwrite: true
  stage:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    needs:
    - resolve
    permissions:
      contents: write
    environment: release-candidate
    outputs:
      bundle_digest: ${{ steps.stage.outputs.bundle_digest }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.workflow_sha }}
        persist-credentials: false
        fetch-depth: 0
    - uses: $/.github/actions/setup-release-tooling
      id: tooling
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: promotion-input-${{ github.run_id }}
        path: ${{ runner.temp }}/promotion
    - run: |
        set -euo pipefail
        python3 -B buildish-release-tooling/workflow.py verify "$RUNNER_TEMP/promotion" "$INPUT_DIGEST"
      env:
        BUILDISH_RELEASE_TOOLING_PYTHON: ${{ steps.tooling.outputs.python }}
        INPUT_DIGEST: ${{ needs.resolve.outputs.bundle_digest }}
    - run: |
        set -euo pipefail
        state="$RUNNER_TEMP/promotion/state.json"
        mkdir -p "$RUNNER_TEMP/stage"
        MANIFEST_PATH="$RUNNER_TEMP/stage/tag.json" bash buildish-release-tooling/release-tooling.sh create-final-tag --promotion-state "$state"
        python3 -B buildish-release-tooling/workflow.py seal "$RUNNER_TEMP/stage"
      env:
        BUILDISH_RELEASE_TOOLING_PYTHON: ${{ steps.tooling.outputs.python }}
        GH_TOKEN: ${{ github.token }}
        GIT_COMMITTER_NAME: ATR Maven Bundle Release
        GIT_COMMITTER_EMAIL: dev@buildish.org
      id: stage
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: promotion-stage-${{ github.run_id }}
        path: ${{ runner.temp }}/stage
        if-no-files-found: error
        retention-days: 90
        overwrite: true
  inspect-central:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    needs:
    - resolve
    - stage
    outputs:
      status: ${{ steps.inspect.outputs.status }}
    if: ${{ !cancelled() && needs.resolve.result == 'success' && needs.stage.result == 'success' }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.workflow_sha }}
        persist-credentials: false
        fetch-depth: 1
    - uses: $/.github/actions/setup-release-tooling
      id: tooling
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: promotion-input-${{ github.run_id }}
        path: ${{ runner.temp }}/promotion
    - run: |
        set -euo pipefail
        python3 -B buildish-release-tooling/workflow.py verify "$RUNNER_TEMP/promotion" "$INPUT_DIGEST"
      env:
        BUILDISH_RELEASE_TOOLING_PYTHON: ${{ steps.tooling.outputs.python }}
        INPUT_DIGEST: ${{ needs.resolve.outputs.bundle_digest }}
    - run: |
        set -euo pipefail
        python3 -B buildish-release-tooling/workflow.py unpack "$RUNNER_TEMP/promotion/assets/buildish-atr-maven-bundle-$RELEASE_VERSION-maven.zip" "$RUNNER_TEMP/repository" "$RELEASE_VERSION"
      env:
        BUILDISH_RELEASE_TOOLING_PYTHON: ${{ steps.tooling.outputs.python }}
        RELEASE_VERSION: ${{ inputs.version }}
    - run: |
        set -euo pipefail
        status="$(python3 -B buildish-release-tooling/registries.py inspect central "$RUNNER_TEMP/repository" "$RELEASE_VERSION")"
        printf "status=%s\n" "$status" >> "$GITHUB_OUTPUT"
      env:
        BUILDISH_RELEASE_TOOLING_PYTHON: ${{ steps.tooling.outputs.python }}
        RELEASE_VERSION: ${{ inputs.version }}
      id: inspect
  publish-central:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    needs:
    - resolve
    - inspect-central
    environment: release-candidate
    if: ${{ !cancelled() && needs.resolve.result == 'success' && needs.inspect-central.result == 'success' && needs.inspect-central.outputs.status
      == 'absent' }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.workflow_sha }}
        persist-credentials: false
        fetch-depth: 1
    - uses: $/.github/actions/setup-release-tooling
      id: tooling
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: promotion-input-${{ github.run_id }}
        path: ${{ runner.temp }}/promotion
    - run: |
        set -euo pipefail
        python3 -B buildish-release-tooling/workflow.py verify "$RUNNER_TEMP/promotion" "$INPUT_DIGEST"
      env:
        BUILDISH_RELEASE_TOOLING_PYTHON: ${{ steps.tooling.outputs.python }}
        INPUT_DIGEST: ${{ needs.resolve.outputs.bundle_digest }}
    - run: |
        set -euo pipefail
        python3 -B buildish-release-tooling/workflow.py unpack "$RUNNER_TEMP/promotion/assets/buildish-atr-maven-bundle-$RELEASE_VERSION-maven.zip" "$RUNNER_TEMP/repository" "$RELEASE_VERSION"
      env:
        BUILDISH_RELEASE_TOOLING_PYTHON: ${{ steps.tooling.outputs.python }}
        RELEASE_VERSION: ${{ inputs.version }}
    - run: |
        set -euo pipefail
        python3 -B buildish-release-tooling/registries.py upload-central "$RUNNER_TEMP/promotion/assets/buildish-atr-maven-bundle-$RELEASE_VERSION-maven.zip" "$RUNNER_TEMP/deployment/result.json"
      env:
        BUILDISH_RELEASE_TOOLING_PYTHON: ${{ steps.tooling.outputs.python }}
        RELEASE_VERSION: ${{ inputs.version }}
        CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
        CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: central-deployment-${{ github.run_id }}
        path: ${{ runner.temp }}/deployment
        if-no-files-found: error
        retention-days: 90
        overwrite: true
  verify-central:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    needs:
    - resolve
    - inspect-central
    - publish-central
    outputs:
      bundle_digest: ${{ steps.verify.outputs.bundle_digest }}
    if: ${{ !cancelled() && needs.resolve.result == 'success' && needs.inspect-central.result == 'success' && (needs.publish-central.result
      == 'success' || needs.publish-central.result == 'skipped') }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.workflow_sha }}
        persist-credentials: false
        fetch-depth: 1
    - uses: $/.github/actions/setup-release-tooling
      id: tooling
    - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880
      with:
        distribution: temurin
        java-version: |-
          17
          21
        overwrite-settings: false
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: promotion-input-${{ github.run_id }}
        path: ${{ runner.temp }}/promotion
    - run: |
        set -euo pipefail
        python3 -B buildish-release-tooling/workflow.py verify "$RUNNER_TEMP/promotion" "$INPUT_DIGEST"
      env:
        BUILDISH_RELEASE_TOOLING_PYTHON: ${{ steps.tooling.outputs.python }}
        INPUT_DIGEST: ${{ needs.resolve.outputs.bundle_digest }}
    - run: |
        set -euo pipefail
        python3 -B buildish-release-tooling/workflow.py unpack "$RUNNER_TEMP/promotion/assets/buildish-atr-maven-bundle-$RELEASE_VERSION-maven.zip" "$RUNNER_TEMP/repository" "$RELEASE_VERSION"
      env:
        BUILDISH_RELEASE_TOOLING_PYTHON: ${{ steps.tooling.outputs.python }}
        RELEASE_VERSION: ${{ inputs.version }}
    - run: |
        set -euo pipefail
        python3 -B buildish-release-tooling/registries.py verify central "$RUNNER_TEMP/repository" "$RELEASE_VERSION" "$RUNNER_TEMP/central/readback.json" --attempts 91 --retry-delay 10 --total-timeout 960
        bash buildish-release-tooling/consume.sh "https://repo.maven.apache.org/maven2/" "$RELEASE_VERSION" "$RUNNER_TEMP/consumer"
        python3 -B buildish-release-tooling/workflow.py seal "$RUNNER_TEMP/central"
      env:
        BUILDISH_RELEASE_TOOLING_PYTHON: ${{ steps.tooling.outputs.python }}
        RELEASE_VERSION: ${{ inputs.version }}
      id: verify
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: central-verification-${{ github.run_id }}
        path: ${{ runner.temp }}/central
        if-no-files-found: error
        retention-days: 90
        overwrite: true
  inspect-portal:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    needs:
    - resolve
    - verify-central
    outputs:
      status: ${{ steps.inspect.outputs.status }}
    if: ${{ !cancelled() && needs.resolve.result == 'success' && needs.verify-central.result == 'success' }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.workflow_sha }}
        persist-credentials: false
        fetch-depth: 1
    - uses: $/.github/actions/setup-release-tooling
      id: tooling
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: promotion-input-${{ github.run_id }}
        path: ${{ runner.temp }}/promotion
    - run: |
        set -euo pipefail
        python3 -B buildish-release-tooling/workflow.py verify "$RUNNER_TEMP/promotion" "$INPUT_DIGEST"
      env:
        BUILDISH_RELEASE_TOOLING_PYTHON: ${{ steps.tooling.outputs.python }}
        INPUT_DIGEST: ${{ needs.resolve.outputs.bundle_digest }}
    - run: |
        set -euo pipefail
        python3 -B buildish-release-tooling/workflow.py unpack "$RUNNER_TEMP/promotion/assets/buildish-atr-maven-bundle-$RELEASE_VERSION-maven.zip" "$RUNNER_TEMP/repository" "$RELEASE_VERSION"
      env:
        BUILDISH_RELEASE_TOOLING_PYTHON: ${{ steps.tooling.outputs.python }}
        RELEASE_VERSION: ${{ inputs.version }}
    - run: |
        set -euo pipefail
        status="$(python3 -B buildish-release-tooling/registries.py inspect portal "$RUNNER_TEMP/repository" "$RELEASE_VERSION")"
        printf "status=%s\n" "$status" >> "$GITHUB_OUTPUT"
      env:
        BUILDISH_RELEASE_TOOLING_PYTHON: ${{ steps.tooling.outputs.python }}
        RELEASE_VERSION: ${{ inputs.version }}
      id: inspect
  publish-portal:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    needs:
    - resolve
    - inspect-portal
    environment: release-candidate
    if: ${{ !cancelled() && needs.resolve.result == 'success' && needs.inspect-portal.result == 'success' && needs.inspect-portal.outputs.status
      == 'absent' }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.workflow_sha }}
        persist-credentials: false
        fetch-depth: 1
    - uses: $/.github/actions/setup-release-tooling
      id: tooling
    - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880
      with:
        distribution: temurin
        java-version: |-
          17
          21
        overwrite-settings: false
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: promotion-input-${{ github.run_id }}
        path: ${{ runner.temp }}/promotion
    - run: |
        set -euo pipefail
        python3 -B buildish-release-tooling/workflow.py verify "$RUNNER_TEMP/promotion" "$INPUT_DIGEST"
      env:
        BUILDISH_RELEASE_TOOLING_PYTHON: ${{ steps.tooling.outputs.python }}
        INPUT_DIGEST: ${{ needs.resolve.outputs.bundle_digest }}
    - run: |
        set -euo pipefail
        python3 -B buildish-release-tooling/workflow.py unpack "$RUNNER_TEMP/promotion/assets/buildish-atr-maven-bundle-$RELEASE_VERSION-maven.zip" "$RUNNER_TEMP/repository" "$RELEASE_VERSION"
      env:
        BUILDISH_RELEASE_TOOLING_PYTHON: ${{ steps.tooling.outputs.python }}
        RELEASE_VERSION: ${{ inputs.version }}
    - run: |
        set -euo pipefail
        ./gradlew --no-daemon --console=plain -p buildish-release-tooling/portal-publisher publishPlugins
      env:
        BUILDISH_RELEASE_TOOLING_PYTHON: ${{ steps.tooling.outputs.python }}
        RELEASE_VERSION: ${{ inputs.version }}
        RELEASE_REPOSITORY: ${{ runner.temp }}/repository
        GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
        GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
  verify-portal:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    needs:
    - resolve
    - inspect-portal
    - publish-portal
    outputs:
      bundle_digest: ${{ steps.verify.outputs.bundle_digest }}
    if: ${{ !cancelled() && needs.resolve.result == 'success' && needs.inspect-portal.result == 'success' && (needs.publish-portal.result
      == 'success' || needs.publish-portal.result == 'skipped') }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.workflow_sha }}
        persist-credentials: false
        fetch-depth: 1
    - uses: $/.github/actions/setup-release-tooling
      id: tooling
    - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880
      with:
        distribution: temurin
        java-version: |-
          17
          21
        overwrite-settings: false
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: promotion-input-${{ github.run_id }}
        path: ${{ runner.temp }}/promotion
    - run: |
        set -euo pipefail
        python3 -B buildish-release-tooling/workflow.py verify "$RUNNER_TEMP/promotion" "$INPUT_DIGEST"
      env:
        BUILDISH_RELEASE_TOOLING_PYTHON: ${{ steps.tooling.outputs.python }}
        INPUT_DIGEST: ${{ needs.resolve.outputs.bundle_digest }}
    - run: |
        set -euo pipefail
        python3 -B buildish-release-tooling/workflow.py unpack "$RUNNER_TEMP/promotion/assets/buildish-atr-maven-bundle-$RELEASE_VERSION-maven.zip" "$RUNNER_TEMP/repository" "$RELEASE_VERSION"
      env:
        BUILDISH_RELEASE_TOOLING_PYTHON: ${{ steps.tooling.outputs.python }}
        RELEASE_VERSION: ${{ inputs.version }}
    - run: |
        set -euo pipefail
        python3 -B buildish-release-tooling/registries.py verify portal "$RUNNER_TEMP/repository" "$RELEASE_VERSION" "$RUNNER_TEMP/portal/readback.json" --attempts 91 --retry-delay 10 --total-timeout 960
        bash buildish-release-tooling/consume.sh "https://plugins.gradle.org/m2/" "$RELEASE_VERSION" "$RUNNER_TEMP/consumer"
        python3 -B buildish-release-tooling/workflow.py seal "$RUNNER_TEMP/portal"
      env:
        BUILDISH_RELEASE_TOOLING_PYTHON: ${{ steps.tooling.outputs.python }}
        RELEASE_VERSION: ${{ inputs.version }}
      id: verify
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: portal-verification-${{ github.run_id }}
        path: ${{ runner.temp }}/portal
        if-no-files-found: error
        retention-days: 90
        overwrite: true
  publish:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    needs:
    - resolve
    - stage
    - verify-central
    - verify-portal
    permissions:
      contents: write
    environment: release-candidate
    if: ${{ !cancelled() && needs.resolve.result == 'success' && needs.stage.result == 'success' && needs.verify-central.result
      == 'success' && needs.verify-portal.result == 'success' }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.workflow_sha }}
        persist-credentials: false
        fetch-depth: 1
    - uses: $/.github/actions/setup-release-tooling
      id: tooling
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: promotion-input-${{ github.run_id }}
        path: ${{ runner.temp }}/promotion
    - run: |
        set -euo pipefail
        python3 -B buildish-release-tooling/workflow.py verify "$RUNNER_TEMP/promotion" "$INPUT_DIGEST"
      env:
        BUILDISH_RELEASE_TOOLING_PYTHON: ${{ steps.tooling.outputs.python }}
        INPUT_DIGEST: ${{ needs.resolve.outputs.bundle_digest }}
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: promotion-stage-${{ github.run_id }}
        path: ${{ runner.temp }}/stage
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: central-verification-${{ github.run_id }}
        path: ${{ runner.temp }}/central
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: portal-verification-${{ github.run_id }}
        path: ${{ runner.temp }}/portal
    - run: |
        set -euo pipefail
        python3 -B buildish-release-tooling/workflow.py preflight promotion
        python3 -B buildish-release-tooling/workflow.py verify "$RUNNER_TEMP/stage" "$STAGE_DIGEST"
        python3 -B buildish-release-tooling/workflow.py verify "$RUNNER_TEMP/central" "$CENTRAL_DIGEST"
        python3 -B buildish-release-tooling/workflow.py verify "$RUNNER_TEMP/portal" "$PORTAL_DIGEST"
        python3 -B buildish-release-tooling/workflow.py fetch-tag "$RUNNER_TEMP/promotion/state.json" "$STATE_DIGEST"
        mkdir -p "$RUNNER_TEMP/sealed"
        state="$RUNNER_TEMP/sealed/state.json"
        python3 -B buildish-release-tooling/registries.py evidence "$RUNNER_TEMP/promotion/state.json" "$RUNNER_TEMP/central/readback.json" "$RUNNER_TEMP/portal/readback.json" "$state"
        # Restaging a sealed release needs the independently rebuilt registry evidence.
        assets=("$RUNNER_TEMP/promotion/assets/"*)
        MANIFEST_PATH="$RUNNER_TEMP/sealed/stage.json" bash buildish-release-tooling/release-tooling.sh stage-github-final-release --release-state "$state" "${assets[@]/#/--asset=}"
        manifest="$RUNNER_TEMP/sealed/release-manifest-v1.json"
        existing="$(gh release view "v$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --json assets --jq '[.assets[] | select(.name == "release-manifest-v1.json")] | length')"
        if [[ "$existing" = 1 ]]; then
          gh release download "v$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --pattern release-manifest-v1.json --dir "$RUNNER_TEMP/sealed"
        elif [[ "$existing" = 0 ]]; then
          MANIFEST_PATH="$manifest" bash buildish-release-tooling/release-tooling.sh create-release-manifest --release-state "$state" --publication-result "$RUNNER_TEMP/sealed/stage.json"
        else
          echo 'Unexpected manifest inventory'; exit 1
        fi
        bash buildish-release-tooling/release-tooling.sh attach-github-release-manifest --release-state "$state" --release-manifest "$manifest"
        digest="$(sha256sum "$manifest" | cut -d' ' -f1)"
        MANIFEST_PATH="$RUNNER_TEMP/sealed/publication.json" bash buildish-release-tooling/release-tooling.sh publish-github-final-release --release-state "$state" --require-manifest-digest "$digest"
        MANIFEST_PATH="$RUNNER_TEMP/sealed/verification.json" bash buildish-release-tooling/release-tooling.sh verify-github-final-release --release-state "$state"
        printf 'Final: v%s; sealed manifest SHA-256: %s\n' "$RELEASE_VERSION" "$digest" >> "$GITHUB_STEP_SUMMARY"
      env:
        BUILDISH_RELEASE_TOOLING_PYTHON: ${{ steps.tooling.outputs.python }}
        RELEASE_VERSION: ${{ inputs.version }}
        CANDIDATE_TAG: ${{ inputs.candidate_tag }}
        CANDIDATE_MANIFEST_DIGEST: ${{ inputs.candidate_manifest_digest }}
        GH_TOKEN: ${{ github.token }}
        STAGE_DIGEST: ${{ needs.stage.outputs.bundle_digest }}
        CENTRAL_DIGEST: ${{ needs.verify-central.outputs.bundle_digest }}
        PORTAL_DIGEST: ${{ needs.verify-portal.outputs.bundle_digest }}
        STATE_DIGEST: ${{ needs.resolve.outputs.state_digest }}
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: promotion-sealed-${{ github.run_id }}
        path: ${{ runner.temp }}/sealed
        if-no-files-found: error
        retention-days: 90
        overwrite: true
